<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>THE NEWS | GroupProject(SansiAsaf,Nehxet,MiniPekka)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', 'Helvetica', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #app {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* ========== SİDE BAR - SADE VE ŞIK ========== */
        .side-bar {
            position: fixed;
            top: 0;
            left: -400px;
            width: 350px;
            height: 100vh;
            background: #111;
            border-right: 2px solid #333;
            transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            padding: 100px 25px 25px;
            box-shadow: 5px 0 30px rgba(0,0,0,0.5);
            overflow-y: auto;
        }

        .side-bar.open {
            left: 0;
        }

        .menu-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 60px;
            height: 60px;
            background: #222;
            border: 2px solid #444;
            border-radius: 10px;
            cursor: pointer;
            z-index: 1001;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .menu-btn:hover {
            background: #333;
            border-color: #666;
        }

        .menu-btn span {
            width: 35px;
            height: 4px;
            background: white;
            transition: all 0.3s;
        }

        .menu-btn.open span:nth-child(1) {
            transform: rotate(45deg) translate(8px, 8px);
        }

        .menu-btn.open span:nth-child(2) {
            opacity: 0;
        }

        .menu-btn.open span:nth-child(3) {
            transform: rotate(-45deg) translate(8px, -8px);
        }

        .side-bar-item {
            width: 100%;
            padding: 25px;
            margin: 15px 0;
            background: #1a1a1a;
            border: 1px solid #333;
            color: white;
            font-size: 1.8em;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            border-left: 5px solid transparent;
        }

        .side-bar-item:hover {
            background: #222;
            border-left-color: #666;
            transform: translateX(5px);
        }

        .side-bar-item.news {
            border-left-color: #e74c3c;
        }

        /* EMEĞİ GEÇENLER BUTONU */
        .credits-side {
            width: 100%;
            padding: 25px;
            margin: 15px 0;
            background: #1a1a1a;
            border: 1px solid #444;
            color: #ccc;
            font-size: 1.5em;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            border-left: 5px solid #888;
        }

        .credits-side:hover {
            background: #222;
            border-left-color: #aaa;
            color: white;
            transform: translateX(5px);
        }

        /* 0909.PNG GÖRSELİ - DİKDÖRTGEN BÜYÜK */
        .sidebar-image {
            width: 100%;
            margin: 20px 0 10px 0;
            padding: 0;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid #444;
            background: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: all 0.3s;
        }

        .sidebar-image:hover {
            transform: scale(1.02);
            border-color: #666;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
        }

        .sidebar-image img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .image-caption {
            text-align: center;
            padding: 10px;
            color: #888;
            font-size: 0.9em;
            background: #1a1a1a;
            border-top: 1px solid #333;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            z-index: 999;
            backdrop-filter: blur(5px);
        }

        .overlay.active {
            display: block;
        }

        /* ========== ANA EKRAN ========== */
        #mainScreen {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            background: #000;
            color: white;
        }

        .news-header {
            background: #111;
            padding: 20px 20px 20px 100px;
            text-align: center;
            border-bottom: 2px solid #333;
            position: relative;
        }

        .news-header h1 {
            font-size: 4em;
            font-family: 'Times New Roman', serif;
            font-weight: 300;
            letter-spacing: 5px;
            color: white;
        }

        .lang-switch {
            position: absolute;
            top: 25px;
            right: 20px;
            display: flex;
            gap: 10px;
        }

        .lang-switch button {
            width: 60px;
            height: 45px;
            background: #222;
            color: white;
            border: 1px solid #444;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.2em;
        }

        .lang-switch button:hover {
            background: #333;
            border-color: #666;
        }

        .news-content {
            padding: 30px;
            margin-left: 70px;
        }

        /* ========== 1. SAYFA ========== */
        .cover-page {
            min-height: calc(100vh - 120px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 60px;
        }

        .cover-gif {
            width: 90%;
            max-width: 900px;
            overflow: hidden;
            background: #111;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .cover-gif:first-child {
            height: 600px;
        }

        .cover-gif:last-child {
            height: 400px;
            width: 90%;
            max-width: 1200px;
        }

        .cover-gif img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cover-title {
            font-size: 6em;
            font-family: 'Times New Roman', serif;
            color: white;
            border-top: 2px solid #333;
            padding-top: 40px;
            text-shadow: 3px 3px 0 #333;
        }

        /* ========== HABER SAYFALARI ========== */
        .news-single {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .news-card {
            background: #111;
            padding: 50px;
            border: 1px solid #333;
            transition: all 0.3s;
        }

        .news-card:hover {
            border-color: #666;
            transform: translateX(5px);
        }

        .news-meta {
            color: #888;
            font-size: 1.3em;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .news-title {
            font-size: 3.5em;
            color: white;
            margin-bottom: 30px;
            line-height: 1.3;
        }

        .news-image {
            width: 100%;
            height: 550px;
            background: #222;
            margin: 30px 0;
            border: 3px solid #333;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        }

        .news-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .news-text {
            color: #ccc;
            line-height: 2;
            font-size: 1.4em;
            text-align: justify;
        }

        /* ========== SON SAYFA ========== */
        .last-page {
            min-height: calc(100vh - 120px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 60px;
            padding: 40px;
        }

        .last-page img {
            width: 900px;
            height: 500px;
            border: 8px solid #333;
            object-fit: cover;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-20px) scale(1.02); }
        }

        .last-message {
            font-size: 5.5em;
            color: white;
            text-align: center;
            line-height: 1.5;
            animation: glow 2s ease-in-out infinite;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .last-message small {
            font-size: 0.5em;
            display: block;
            color: #ffd700;
            margin-top: 20px;
            animation: fadeInOut 3s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { text-shadow: 0 0 20px rgba(255, 215, 0, 0.5); }
            50% { text-shadow: 0 0 40px rgba(255, 215, 0, 0.9), 0 0 60px rgba(255, 215, 0, 0.5); }
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        .request-message {
            font-size: 1.8em;
            color: #888;
            margin-top: 20px;
            text-align: center;
            max-width: 800px;
            line-height: 1.6;
            border-top: 1px solid #333;
            padding-top: 30px;
        }

        .request-message span {
            color: #ffd700;
            font-weight: bold;
        }

        /* ========== SAYFALAMA ========== */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            padding: 30px 20px 25px 20px;
            background: #111;
            border-top: 2px solid #333;
            margin-left: 70px;
            position: relative;
            z-index: 5;
        }

        .page-btn {
            padding: 15px 40px;
            background: #222;
            color: white;
            border: 1px solid #444;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.2em;
            position: relative;
            overflow: hidden;
        }

        .page-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            transform: translate(-50%, -50%);
            transition: width 0.4s, height 0.4s;
        }

        .page-btn:hover:not(:disabled)::after {
            width: 200px;
            height: 200px;
        }

        .page-btn:hover:not(:disabled) {
            background: #333;
            border-color: #666;
        }

        .page-btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        .page-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .page-info {
            color: white;
            font-size: 1.4em;
        }

        /* Sayfa geçiş animasyonu */
        .news-content {
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* MODAL - EMEĞİ GEÇENLER */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
        }

        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #111;
            padding: 40px;
            border: 2px solid #333;
            z-index: 2001;
            width: 90%;
            max-width: 500px;
            color: white;
        }

        .modal.active, .modal-overlay.active {
            display: block;
        }

        .modal h2 {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 40px;
            color: white;
            border-bottom: 2px solid #333;
            padding-bottom: 20px;
        }

        .credit-item {
            background: #1a1a1a;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 5px solid #666;
            transition: all 0.3s;
        }

        .credit-item:hover {
            background: #222;
            border-left-color: #888;
        }

        .credit-name {
            font-weight: bold;
            color: white;
            font-size: 1.6em;
            margin-bottom: 8px;
        }

        .credit-role {
            color: #aaa;
            font-size: 1.1em;
            line-height: 1.5;
        }

        .close-modal {
            background: #222;
            color: white;
            padding: 15px;
            border: 1px solid #444;
            width: 100%;
            cursor: pointer;
            margin-top: 20px;
            font-size: 1.2em;
            transition: all 0.3s;
        }

        .close-modal:hover {
            background: #333;
            border-color: #666;
        }

        /* MÜZİK */
        .music-control {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 100;
        }

        .music-btn {
            width: 60px;
            height: 60px;
            background: #222;
            color: white;
            border: 2px solid #444;
            border-radius: 30px;
            font-size: 1.8em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .music-btn:hover {
            background: #333;
            border-color: #666;
            transform: scale(1.1);
        }
    </style>
</head>

            document.getElementById('sideBar').classList.toggle('open');
            document.getElementById('menuBtn').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('active');
        }

        // ========== DEĞİŞKENLER ==========
        let currentLang = 'tr';
        let currentPage = 1;
        const totalPages = 17;
        let isMusicOn = true;

        // ========== UZUN HABERLER ==========
        const haberler = [
            {
                tr: "Havana Sendromu: Sosyal Medya ve Yapay Zeka Forumunun Sırları",
                en: "Havana Syndrome: Secrets of Social Media and AI Forum",
                icerik_tr: "The Interface programında Havana sendromu, sosyal medyanın yargılanması ve yapay zeka forumunun gizli kalmış sırları mercek altına alınıyor. Uzmanlar teknolojinin insan sağlığı üzerindeki etkilerini tartışıyor. 35 dakikalık özel bölüm büyük ilgi gördü. Programda, diplomatlar ve istihbarat görevlilerini etkileyen gizemli Havana sendromunun ardında yeni nesil yönlendirilmiş enerji silahları mı yoksa kitlesel histeri mi olduğu sorusu irdeleniyor. Yapay zeka forumunda ise, büyük teknoloji şirketlerinin etik sınırları zorlayan uygulamaları ve hükümetlerle gizli işbirlikleri masaya yatırılıyor.",
                icerik_en: "In The Interface program, Havana syndrome, the trial of social media and the hidden secrets of the AI forum are being scrutinized. Experts discuss the effects of technology on human health. The 35-minute special episode attracted great attention. The program examines whether next-generation directed energy weapons or mass hysteria lie behind the mysterious Havana syndrome affecting diplomats and intelligence officers.",

                kategori: "TEKNOLOJİ"
            },
            {
                tr: "Moda Endüstrisinin Kör Noktası: Beden Ölçüleri ve Yapay Zeka Çözümü",
                en: "Fashion Industry's Blind Spot: Sizing and AI Solution",
                icerik_tr: "Tech Now, moda endüstrisinin en büyük sorunlarından biri olan tutarsız beden ölçülerini çözmeye çalışan bir girişimle görüştü. Yeni teknoloji sayesinde herkes kendine uygun kıyafetleri bulabilecek. Startup'ın geliştirdiği yapay zeka tabanlı ölçüm sistemi devrim yaratabilir. Günümüzde her markanın farklı beden tabloları kullanması, özellikle online alışverişte büyük hayal kırıklıklarına ve iade oranlarının fırlamasına neden oluyor.",

                kategori: "TEKNOLOJİ"
            },
            {

                kategori: "ÇEVRE"

            {

                icerik_tr: "Her yıl 8 milyon ton plastik okyanuslara karışıyor. Deniz canlıları bu plastikleri yiyerek yaşamını yitiriyor. Yeni bir araştırma, plastik kirliliğinin 2050'ye kadar üç katına çıkabileceğini gösteriyor. Bilim insanları, mevcut gidişatın durdurulamaması halinde, 2050 yılında okyanuslarda balıktan çok plastik atık bulunacağını belirtiyor.",

                kategori: "ÇEVRE"
            },
            {

                icerik_tr: "Bilim insanları, erken evre kanseri tespit edebilen bir kan testi geliştirdi. Test, 50'den fazla kanser türünü yüksek doğrulukla tespit edebiliyor. Bu buluş, milyonlarca insanın hayatını kurtarabilir. İngiltere'deki araştırma merkezinde geliştirilen test, tümörlerin kana saldığı DNA parçacıklarını analiz ederek çalışıyor.",
